<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Siti Streaming</title>
    <script>
        async function caricaSiti() {
            const res = await fetch('/api/sites');
            const dati = await res.json();
            document.getElementById('lista').innerHTML = dati.map(s => 
                `<li class="p-2 border-b flex justify-between">${s.url} <span class="${s.status === 'online' ? 'text-green-500' : 'text-red-500'}">${s.status}</span></li>`
            ).join('');
        }

        async function aggiungiSito() {
            const url = document.getElementById('nuovo').value;
            const res = await fetch('/api/sites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            if (res.ok) {
                document.getElementById('nuovo').value = "";
                caricaSiti();
            } else {
                alert("URL non valido");
            }
        }

        window.onload = caricaSiti;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 text-gray-800">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">Gestione Siti Streaming</h1>
        <div class="flex mb-4 gap-2">
            <input id="nuovo" class="flex-1 border px-3 py-2 rounded" placeholder="https://sito.com/search?q={query}" />
            <button onclick="aggiungiSito()" class="bg-blue-600 text-white px-4 py-2 rounded">Aggiungi</button>
        </div>
        <ul id="lista" class="divide-y"></ul>
    </div>
</body>
</html>
